# version: '3.8'

services:
  mongo:
    image: mongo:6
    container_name: magicity-mongo
    restart: always
#    ports:
#      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - magicity-net

  backend:
    build: .
    container_name: magicity-backend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    volumes:
      # Загруженные фотографии переживают пересборку образа.
      # Без этого папка жила внутри контейнера, и всё, что залили через
      # приложение, пропадало при следующем деплое — уцелевало только то,
      # что руками закоммитили в репозиторий.
      # При первом запуске Docker наполнит пустой том содержимым образа,
      # так что уже лежащие картинки не потеряются
      - uploads_data:/app/uploads
    networks:
      - magicity-net
#    environment:
#      MONGO_URI: mongodb://mongo:27017/dbname

  nginx:
    image: nginx:latest
    container_name: magicity-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/html:/usr/share/nginx/html
      - /etc/letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
    networks:
      - magicity-net

networks:
  magicity-net:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:


