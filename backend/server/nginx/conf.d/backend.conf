limit_req_zone $binary_remote_addr zone=demo_spin:10m rate=1r/m;

server {
    listen 80;
    server_name magicity.top www.magicity.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name magicity.top www.magicity.top;

    # Подключаем сертификаты (они будут доступны в контейнере через volume)
    ssl_certificate /etc/letsencrypt/live/magicity.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/magicity.top/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Загрузка фотографий. По умолчанию nginx рубит тело запроса на 1 МБ,
    # и снимок с телефона до бэкенда просто не доезжал: nginx отвечал 413
    # со своей страницы, без CORS-заголовков, а браузер показывал это
    # невнятной сетевой ошибкой.
    # Держим чуть выше лимита multer (20 МБ), чтобы отказ по размеру
    # приходил от приложения понятным сообщением, а не от nginx
    client_max_body_size 25m;

    # Блокировка вредоносных сканеров
    location ~* ^/(\.env|\.git|\.htaccess|wp-admin|wp-login\.php|phpmyadmin|admin|backup|\.well-known/security\.txt|SDK/webLanguage|cdn-cgi|cgi-bin) {
        return 444;
    }

    # Блокировка path traversal атак
    location ~* \.\./  {
        return 444;
    }

    error_page 429 @too_many_requests;
    location @too_many_requests {
        default_type application/json;
        return 429 '{"message":"max_limit_request","statusCode":429}';
    }

    location = /download {
        root /usr/share/nginx/html;
        try_files /download.html =404;
    }

    # ── Рекламный стенд ──────────────────────────────────────────────────
    #
    # Сюда кладётся собранная веб-версия (содержимое build/web) и рядом
    # ролик-заставка. Стенд открывает https://magicity.top/kiosk/

    # Заставка.
    #
    # no-cache здесь читается как «перед показом перепроверь», а не
    # «не храни»: файл остаётся в дисковом кеше браузера, при неизменном
    # ETag приходит пустой 304, и 35 МБ заново не качаются. Зато
    # заменённый на сервере ролик стенд подхватит со следующей загрузки
    # страницы — с immutable на год он не увидел бы замену вообще.
    #
    # Отдаём статикой, а не ассетом Flutter: ассет уехал бы заодно
    # в сборки для сторов, где 35 МБ заставки не нужны никому, и менять
    # ролик пришлось бы пересборкой приложения
    location = /kiosk/space.mp4 {
        root /usr/share/nginx/html;

        add_header Cache-Control "no-cache";

        # Плеер тянет ролик кусками
        add_header Accept-Ranges bytes;
    }

    # Само приложение. try_files нужен, потому что маршрутизация клиентская:
    # без него прямой заход на /kiosk/wheel вернул бы 404 вместо приложения.
    #
    # Длинный кеш здесь ставить нельзя: index.html и flutter_bootstrap.js
    # обязаны перечитываться, иначе стенд навсегда останется на той сборке,
    # которую увидел первой. no-cache — это «перепроверь», а не «не храни»:
    # при живом ETag ответ будет дешёвый 304
    location /kiosk/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /kiosk/index.html;

        add_header Cache-Control "no-cache";
    }

    location /wheel/demo/spin {
        limit_req zone=demo_spin burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://magicity-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Проксируем backend
    location / {
        proxy_pass http://magicity-backend:3000;

        # Websocket и HTTP проксирование
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Заголовки клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Кэш отключаем для API
        proxy_cache_bypass $http_upgrade;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://magicity-backend:3000/uploads/;

        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Можно добавить логи
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
